name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The archive under ab/nn/stat holds ~545k JSON files that the code
      # and tests do not need; skipping it keeps checkout fast.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ab/nn/stat/
            !/results/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile the package
        run: python -m compileall -q ab

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ab/nn/stat/
            !/results/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pandas pyyaml optuna psutil tqdm radon zstandard huggingface_hub datasets
          pip install --no-deps -e .
      # Tests that download the full LEMUR database from Hugging Face are
      # excluded from the fast CI run; run them locally against a released
      # database snapshot. test/val_split runs in its own step below.
      - name: Run tests
        run: >-
          python -m pytest -q -o python_files="test_*.py test.py" test test-ext
          --ignore=test-ext/test_utkface.py
          --ignore=test/test.py
          --ignore=test/test_nonnull.py
          --ignore=test/val_split
          --deselect test/test_uuid4_arch_uid.py::test_duplicate_model_is_not_added_twice
      # The validation-split tests create db/ in the working directory, so each
      # one runs in its own process from a fresh, empty directory.
      - name: Run validation-split tests
        run: |
          tests=$(python -m pytest --collect-only -q test/val_split | grep '::')
          for t in $tests; do
            d=$(mktemp -d)
            (cd "$d" && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/$t") || exit 1
          done
