name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The archive under ab/nn/stat holds ~545k JSON files that the code
      # and tests do not need; skipping it keeps checkout fast.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ab/nn/stat/
            !/results/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile the package
        run: python -m compileall -q ab

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ab/nn/stat/
            !/results/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pandas pyyaml optuna psutil tqdm radon zstandard huggingface_hub
          pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q -o python_files="test_*.py test.py" test test-ext --ignore=test-ext/test_utkface.py
